spring.application.name=dsc-collector
server.port=8080

# Use H2 by default for easy local running without Docker/Postgres
spring.datasource.url=jdbc:h2:mem:gas_dsc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable flyway for H2 fallback (use hibernate ddl-auto instead)
spring.flyway.enabled=false

# App Settings
jwt.secret=${JWT_SECRET:very-long-secret-key-for-local-development-needs-to-be-at-least-256-bits-long!}
jwt.expiration-ms=86400000

# API Keys (use environment variables in production!)
app.public.url=https://duchesslike-unlibellously-lovetta.ngrok-free.dev
elevenlabs.api.key=YOUR_ELEVENLABS_API_KEY
elevenlabs.api.base-url=${ELEVENLABS_BASE_URL:https://api.elevenlabs.io/v1}
twilio.account.sid=YOUR_TWILIO_ACCOUNT_SID
twilio.auth.token=YOUR_TWILIO_AUTH_TOKEN
twilio.phone.number=YOUR_TWILIO_PHONE_NUMBER

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Rate Limiting
app.rate-limit.auth.requests-per-minute=10
app.rate-limit.auth.block-duration-minutes=5

elevenlabs.agent.phone.number.id=YOUR_ELEVENLABS_PHONE_ID
