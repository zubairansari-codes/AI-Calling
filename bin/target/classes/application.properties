# ============================================
# Gas Agency DSC Collector — Configuration
# ============================================

spring.application.name=gas-dsc-collector

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/gas_dsc
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:default-dev-secret-change-in-production-must-be-at-least-256-bits-long}
jwt.expiration-ms=86400000

# ElevenLabs
elevenlabs.api.key=${ELEVENLABS_API_KEY:}
elevenlabs.api.base-url=https://api.elevenlabs.io/v1

# Twilio
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# Campaign Settings
campaign.max-concurrent-calls=10
campaign.call-start-hour=9
campaign.call-end-hour=18
campaign.max-retry-attempts=3
campaign.retry-delay-minutes=60

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
